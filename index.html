["Food safety","Which pathogen can grow at refrigeration temperatures, is linked to deli meats and soft cheeses, and carries a high fatality rate for a fetus?",["Shigella","Listeria monocytogenes","Campylobacter jejuni","Norovirus"],1,"Listeria monocytogenes grows in the fridge; found in unwashed produce, deli meats and soft cheeses."],

["Production systems","A hospital's kitchen is far from patient floors, so trays are assembled in areas near the patients. Which tray service is this?",["Centralized tray service","Automated cart system","Decentralized tray service","Room service"],2,"Decentralized: trays set up near the customer, used when distance is great and more equipment/staff are needed."],
["Space planning","A cafeteria is open 2.5 hrs with a seat turnover of 2 per hr and 300 customers. How many seats are needed?",["60 seats","120 seats","150 seats","75 seats"],0,"Total turnover = 2 x 2.5 = 5. Seats = customers / turnover = 300 / 5 = 60."],
["Portioning","How many ounces does a #10 scoop (disher) hold?",["0.3 oz","3.2 oz","4.0 oz","6.4 oz"],1,"Ounces = 32 / scoop number = 32 / 10 = 3.2 oz. Larger scoop numbers give smaller portions."],

["Food science","An angel food cake is tough, yellow and small. What most likely contributed?",["Too much acid was added","The cake was overcooked","Not enough acid (cream of tartar) was added","The cake was undercooked"],2,"Cream of tartar (acidic) keeps colour white, stabilizes the egg-white foam and tenderizes the crumb."],
